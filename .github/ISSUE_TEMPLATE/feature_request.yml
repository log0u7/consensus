name: Feature request
description: Propose an improvement or a new capability
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep proposals scoped. Adding a domain usually needs zero application
        code: a `teams/<name>.yaml` manifest plus optional skills. Check
        `docs/teams.md` and the examples in `teams/` first.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and what blocks you today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen instead? Sketch the desired behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds or other approaches you evaluated (optional).
    validations:
      required: false
