name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-lint-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-lint-
      - name: Install dev deps
        run: pip install -q -r requirements-dev.txt
      - name: Run ruff
        run: ruff check src tests tui
      - name: Check formatting
        run: ruff format --check src tests tui

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-mypy-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-mypy-
      - name: Install dev deps
        run: pip install -q -r requirements-dev.txt
      - name: Run mypy
        run: mypy src tui

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-test-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: pip-test-${{ matrix.python-version }}-
      - name: Install dev deps
        run: pip install -q -r requirements-dev.txt
      - name: Run pytest
        env:
          ZEN_API_KEY: dummy
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  sandbox:
    name: Docker sandbox tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dev deps
        run: pip install -q -r requirements-dev.txt
      - name: Pull sandbox image
        run: docker pull python:3.12-slim
      - name: Run sandbox tests
        env:
          ZEN_API_KEY: dummy
        run: pytest tests/test_sandbox.py

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t consensus-ci -f Dockerfile .
