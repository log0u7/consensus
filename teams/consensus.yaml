# Standard code review team.
# Topology: coder -> parallel panel -> consensus aggregator -> lead.
#
# Env-driven by design: no models are pinned here, so CODER_MODEL,
# CONSENSUS_MODEL, LEAD_MODEL, REVIEW_PANEL and CHAT_MODEL (see env.example)
# decide what runs. Pin models in this file only to lock a domain to specific
# models; the coder/consensus/lead role blocks below show the override points.
topology: consensus
sandbox: false

roles:
  coder:
    # model: zen/big-pickle     # uncomment to pin (else CODER_MODEL wins)
    fallback: []
    skills: []
    tools: []
    rag_ns: ""
    sandbox: false

  reviewer:
    # Without 'members' the panel comes from REVIEW_PANEL / config default.
    # members:
    #   - name: reviewer-1
    #     model: zen/big-pickle
    fallback: []
    sandbox: false

  consensus:
    # model: zen/glm-4.5-flash   # else CONSENSUS_MODEL wins
    fallback: []

  lead:
    # model: zen/glm-4.5-flash   # else LEAD_MODEL wins
    fallback: []
